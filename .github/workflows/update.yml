name: Update JGB Calendar

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4
      - run: python update_calendar.py

      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add calendar.ics
          git commit -m "update" || echo "no change"
          git push
